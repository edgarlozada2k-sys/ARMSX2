</style></head><body><header><button class="brand" onclick="switchTab('home')" aria-label="ExKinet Inicio"><svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="xblue" x2="1" y2="1"><stop stop-color="#7ae6ff"/><stop offset="1" stop-color="#0867ff"/></linearGradient></defs><path d="M5 8h10l10 13L37 6h8L29 26l12 15H30L20 29 8 44H1l15-20z" fill="url(#xblue)"/><path d="M34 7h8M4 38h8" stroke="#b4f4ff" stroke-width="2"/></svg><span>ExKinet</span></button><nav aria-label="Navegación principal"><button class="active" data-tab="home">Inicio</button><button data-tab="library">Biblioteca</button><button data-tab="favorites">Favoritos</button><button data-tab="settings" onclick="preferences()">Ajustes</button></nav><div class="right"><button class="search-icon" onclick="switchTab('library');document.getElementById('search').focus()" aria-label="Buscar juegos">⌕</button><span class="clock" id="clock"></span><span class="connection" aria-label="Conexión">◔ ▰</span><button class="avatar" aria-label="Preferencias" onclick="preferences()">F</button></div></header>
<main id="home"><section class="hero"><div class="scene" id="scene"></div><div class="veil"></div><div class="hero-content"><div class="platform-label">PlayStation 2</div><h1 id="title"></h1><div class="meta"><span class="badge">PLAYSTATION 2</span><span id="genre"></span><span>•</span><span id="year"></span></div><p class="desc" id="description"></p><div class="actions"><button class="primary" onclick="play()">▶ &nbsp; Jugar</button><button class="fav" id="favorite" aria-label="Añadir a favoritos" onclick="toggleFavorite()">♡</button></div><div class="quick-settings"><button onclick="quality()">⚙ &nbsp; Ajustes HD</button><button onclick="textures()">▱ &nbsp; Texturas</button></div><div class="chapter" id="chapter"></div></div><div class="art-label">ARTE CONCEPTUAL · PROTOTIPO DE INTERFAZ</div></section><section class="library"><div class="section-head"><h2>Tu colección <small>Una nueva aventura a un toque.</small></h2><div class="tools"><button class="selected" onclick="setFilter('all',this)">Todos</button><button onclick="setFilter('recent',this)">Recientes</button><button onclick="importGame()">＋ Añadir</button></div></div><div class="cards" id="cards"></div></section><section class="bottom"><button class="tile" onclick="quality()"><span class="tile-icon">✧</span><span><strong>Juega con más detalle</strong><small id="profileText">Perfil equilibrado · Resolución 2×</small></span><span class="arrow">↗</span></button><button class="tile" onclick="textures()"><span class="tile-icon">▧</span><span><strong>Texturas HD</strong><small>Un nuevo aspecto para tus mundos</small></span><span class="arrow">↗</span></button><button class="tile" onclick="backup()"><span class="tile-icon">☁</span><span><strong>Tus partidas, contigo</strong><small>Copias y restauración</small></span><span class="arrow">↗</span></button></section></main><section class="screen" id="collection"><div class="eyebrow">TU UNIVERSO, ORGANIZADO</div><h1 id="collectionTitle">Biblioteca</h1><input class="search" id="search" placeholder="Buscar en tu colección…" aria-label="Buscar juegos"><div class="grid" id="grid"></div></section><section class="screen settings-screen" id="settingsScreen"><div class="settings-heading"><div><div class="eyebrow">EXKINET / CONFIGURACIÓN</div><h1>Ajustes</h1><p>Tu consola, a tu manera.</p></div><button class="secondary" onclick="switchTab('home')">← Volver al inicio</button></div><div class="settings-layout"><aside class="settings-nav" aria-label="Categorías de ajustes"><button onclick="settingsPage('general')" data-settings="general">◉ &nbsp; General</button><button onclick="settingsPage('appearance')" data-settings="appearance">✧ &nbsp; Apariencia y movimiento</button><button onclick="settingsPage('graphics')" data-settings="graphics">⚙ &nbsp; Gráficos por juego</button><button onclick="settingsPage('media')" data-settings="media">▷ &nbsp; Fondos y vídeos</button><button onclick="settingsPage('textures')" data-settings="textures">▱ &nbsp; Texturas HD</button><button onclick="settingsPage('controls')" data-settings="controls">⊕ &nbsp; Controles</button><button onclick="settingsPage('backup')" data-settings="backup">↓ &nbsp; Copias y restauración</button></aside><div class="settings-panel" id="settingsContent"></div></div></section><footer><span>ExKinet · PROTOTIPO INTERACTIVO</span><span>← → Explorar &nbsp;&nbsp; Enter Seleccionar &nbsp;&nbsp; Esc Volver</span></footer><dialog id="modal"><div class="modal-head"><h2 id="modalTitle"></h2><button class="close" onclick="modal.close()" aria-label="Cerrar">×</button></div><div id="modalBody"></div></dialog><div class="toast" role="status" id="toast"></div>
<script>
const games=[{id:'rogue',name:'Rogue Galaxy',genre:'Acción · RPG',year:2007,color:'#d89562',sky:'#495d73',desc:'El universo es demasiado grande para quedarse en un solo planeta. Únete a Jaster y comienza tu viaje entre las estrellas.',chapter:'Partida de ejemplo · Rosa, el planeta desértico',sub:'Última partida · Hoy',art:0},{id:'ffx',name:'Final Fantasy X',genre:'Aventura · RPG',year:2001,color:'#75c7c9',sky:'#244f7d',desc:'Un viaje por Spira, entre ciudades perdidas, océanos infinitos y una historia que merece volver a vivirse.',chapter:'Partida de ejemplo · Isla de Besaid',sub:'Última partida · Ayer',art:1},{id:'shadow',name:'Shadow of the Colossus',genre:'Acción · Aventura',year:2005,color:'#a5b69c',sky:'#687d89',desc:'Una tierra silenciosa. Dieciséis colosos. Cabalga hacia el horizonte y descubre una aventura inolvidable.',chapter:'Sin partida reciente',sub:'Listo para jugar',art:2},{id:'gt4',name:'Gran Turismo 4',genre:'Conducción',year:2004,color:'#e9a37a',sky:'#343956',desc:'Cada curva cuenta. Vuelve al asfalto y encuentra tu próxima vuelta perfecta.',chapter:'Partida de ejemplo · Modo Gran Turismo',sub:'Última partida · Hace 3 días',art:3},{id:'kh2',name:'Kingdom Hearts II',genre:'Acción · RPG',year:2005,color:'#a19cdb',sky:'#292e65',desc:'Abre la puerta a otros mundos y continúa una aventura donde todos los caminos conectan.',chapter:'Sin partida reciente',sub:'Listo para jugar',art:4},{id:'gow',name:'God of War II',genre:'Acción',year:2007,color:'#c27662',sky:'#47353c',desc:'Escala templos imponentes y enfréntate al destino en una aventura épica.',chapter:'Sin partida reciente',sub:'Listo para jugar',art:2}];
games.pop();let selected=0,tab='home',filter='all',favorites=[],profiles={},reduce=false;try{let s=JSON.parse(localStorage.getItem('orbit')||'{}');favorites=s.favorites||[];profiles=s.profiles||{};reduce=!!s.reduce}catch{}document.body.classList.toggle('reduced',reduce);const $=id=>document.getElementById(id);function save(){try{localStorage.setItem('orbit',JSON.stringify({favorites,profiles,reduce}))}catch{}}
function art(g,wide=false){return `<img src="assets/${wide&&g.id==='rogue'?'hero':g.id}.webp" alt="${wide?'Fondo de ejemplo de ':'Carátula de ejemplo de '}${g.name}" draggable="false">`}

function card(g){let i=games.indexOf(g);return `<button data-game="${g.id}" class="card ${i===selected?'current':''}" onclick="choose(${i})" aria-label="Seleccionar ${g.name}" aria-pressed="${i===selected}"><div class="poster">${art(g)}<span class="cover-favorite">${favorites.includes(g.id)?'♥':''}</span>${i===0?'<div class="progress"><i></i></div>':''}</div><span class="card-name">${g.name}</span><span class="card-sub">${g.sub}</span></button>`}function render(){let g=games[selected];$('title').textContent=g.name;$('genre').textContent=g.genre;$('year').textContent=g.year;$('description').textContent=g.desc;$('chapter').textContent=g.chapter;updateBackdrop(g);$('favorite').textContent=favorites.includes(g.id)?'♥':'♡';$('favorite').setAttribute('aria-label',favorites.includes(g.id)?'Quitar de favoritos':'Añadir a favoritos');updateHomeCards();renderGrid();$('profileText').textContent=`Perfil ${profiles[g.id]?.profile||'Equilibrado'} · Resolución ${profiles[g.id]?.resolution||'2'}×`}
function choose(i){const previous=selected;selected=i;if(tab!=='home')switchTab('home');render();const active=document.querySelector('.cards .card.current');if(active){const poster=active.querySelector('.poster');if(!reduce&&i!==previous&&poster?.animate){poster.getAnimations().forEach(a=>a.cancel());poster.animate([{transform:'translateY(-3px) scale(1.01)'},{transform:'translateY(-16px) scale(1.04)',offset:.48},{transform:'translateY(-6px) scale(1.035)'}],{duration:650,easing:'cubic-bezier(.22,.75,.18,1)'})}const track=$('cards');if(track.scrollTo){const target=active.offsetLeft-(track.clientWidth-active.offsetWidth)/2;track.scrollTo({left:Math.max(0,target),behavior:reduce?'instant':'smooth'})}}}
function switchTab(t){tab=t;$('home').style.display=t==='home'?'block':'none';$('collection').style.display=['library','favorites'].includes(t)?'block':'none';$('settingsScreen').style.display=t==='settings'?'block':'none';if(t!=='home')stopBackgroundVideo();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));document.body.classList.toggle('collection-view',t!=='home');$('collectionTitle').textContent=t==='favorites'?'Tus favoritos':'Biblioteca';renderGrid();if(t==='home'&&shownBackdrop===games[selected].id)scheduleBackgroundVideo()}function renderGrid(){let q=$('search').value.toLowerCase();let list=games.filter(g=>(tab!=='favorites'||favorites.includes(g.id))&&g.name.toLowerCase().includes(q));$('grid').innerHTML=list.length?list.map(card).join(''):'<p class="empty">No hay juegos aquí. Añade favoritos con el corazón de cada juego.</p>'}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>b.dataset.tab==='settings'?preferences():switchTab(b.dataset.tab));$('search').oninput=renderGrid;function setFilter(f,b){filter=f;document.querySelectorAll('.tools button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');render()}function toggleFavorite(){let id=games[selected].id;favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];save();render()}let timer;function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.remove('show'),3500)}function openModal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').showModal()}function quality(){let p=profiles[games[selected].id]||{};openModal('Tu imagen, a tu manera',`<p class="notice">${games[selected].name} · Ajustes de demostración guardados por juego.</p><label class="row"><span>Perfil de calidad<small>Equilibra detalle y fluidez.</small></span><select id="qualitySelect"><option>Rendimiento</option><option>Equilibrado</option><option>Calidad</option></select></label><label class="row"><span>Resolución interna<small>Mejora la definición de los gráficos 3D.</small></span><select id="resolution"><option value="1">1× · Original</option><option value="2">2× · Más nítido</option><option value="3">3× · Más exigente</option></select></label><label class="row"><span>Renderizador</span><select id="renderer"><option>Vulkan</option><option>OpenGL</option></select></label><p class="notice">En tu Yoga Tab 13, empieza con 1× o 2× y ajusta según el juego. Esta demo no mide rendimiento.</p><button class="primary modal-action" onclick="saveQuality()">Guardar para este juego</button>`);$('qualitySelect').value=p.profile||'Equilibrado';$('resolution').value=p.resolution||'2';$('renderer').value=p.renderer||'Vulkan';$('qualitySelect').onchange=()=>{$('resolution').value=({'Rendimiento':'1','Equilibrado':'2','Calidad':'3'})[$('qualitySelect').value]}}function saveQuality(){profiles[games[selected].id]={...(profiles[games[selected].id]||{}),profile:$('qualitySelect').value,resolution:$('resolution').value,renderer:$('renderer').value};save();render();$('modal').close();toast('Preferencias guardadas para '+games[selected].name)}function textures(){let p=profiles[games[selected].id]||{};openModal('Texturas HD',`<p class="notice">${games[selected].name}</p><label class="row"><span>Vista de paquete de ejemplo<small>Simula la activación de un paquete HD.</small></span><input class="switch" type="checkbox" id="textureToggle" ${p.textures?'checked':''}></label><p class="notice">En la aplicación final, cada paquete deberá coincidir con el juego y su versión. Este prototipo no incluye ni aplica texturas.</p><button class="secondary modal-action" onclick="toast('La importación de texturas estará disponible al integrar el motor.')">＋ Importar paquete ZIP</button>`);$('textureToggle').onchange=e=>{profiles[games[selected].id]={...(profiles[games[selected].id]||{}),textures:e.target.checked};save();toast(e.target.checked?'Paquete de ejemplo activado':'Paquete de ejemplo desactivado')}}function play(){openModal('Tu aventura comienza aquí',`<div style="height:150px;overflow:hidden;border-radius:12px">${art(games[selected],true)}</div><h3>${games[selected].name}</h3><p class="notice">Esta es una demo de la interfaz. Para ejecutar el juego hay que integrar un motor de PS2. No contiene juegos, BIOS ni partidas reales.</p><button class="primary modal-action" onclick="modal.close()">Volver a mi colección</button>`)}function importGame(){openModal('Amplía tu colección','<p class="notice">En la app Android podrás elegir una carpeta de juegos y asignar carátulas y fondos independientes. Aquí puedes explorar la biblioteca de ejemplo.</p><button class="primary modal-action" onclick="modal.close();switchTab(\'library\')">Explorar biblioteca de ejemplo</button>')}function backup(){openModal('Tus preferencias, a salvo','<p class="notice">Exporta los favoritos y ajustes que hayas creado en esta demo. Las partidas reales se incorporarán al integrar el emulador.</p><button class="primary modal-action" onclick="exportBackup()">↓ Exportar preferencias</button><label class="secondary modal-action" style="display:block;text-align:center;cursor:pointer">↑ Restaurar preferencias<input type="file" accept="application/json,.json" style="display:none" onchange="restore(this)"></label>')}function exportBackup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'exkinet-demo',version:1,favorites,profiles,reduce},null,2)],{type:'application/json'}));a.download='exkinet-preferencias.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Preferencias exportadas')}async function restore(input){try{let data=JSON.parse(await input.files[0].text());if(data.app!=='exkinet-demo'||!Array.isArray(data.favorites)||typeof data.profiles!=='object'||data.profiles===null)throw Error();favorites=data.favorites.filter(x=>games.some(g=>g.id===x));profiles={};for(let g of games){let p=data.profiles[g.id];if(p&&['Rendimiento','Equilibrado','Calidad'].includes(p.profile)&&['1','2','3'].includes(String(p.resolution))&&['Vulkan','OpenGL'].includes(p.renderer))profiles[g.id]={profile:p.profile,resolution:String(p.resolution),renderer:p.renderer,textures:!!p.textures}}reduce=!!data.reduce;document.body.classList.toggle('reduced',reduce);save();render();$('modal').close();toast('Preferencias restauradas')}catch{toast('El archivo no es una copia válida de ExKinet.')}}function preferences(){openModal('A tu ritmo',`<p class="notice">ExKinet · Preferencias</p><label class="row"><span>Reducir animaciones<small>Transiciones inmediatas y menos movimiento.</small></span><input class="switch" id="motion" type="checkbox" ${reduce?'checked':''}></label><div class="row"><span>Modo demostración<small>Interfaz interactiva · sin motor de emulación.</small></span></div><div class="row"><span>Dispositivo objetivo<small>Lenovo Yoga Tab 13 · Snapdragon 870</small></span></div><p class="notice">Los favoritos y ajustes se conservan en este navegador.</p><button class="secondary modal-action" onclick="modal.close();backup()">Copias y restauración</button><button class="secondary modal-action" onclick="modal.close();importGame()">Añadir juegos</button>`);$('motion').onchange=e=>{reduce=e.target.checked;document.body.classList.toggle('reduced',reduce);save()}}document.addEventListener('keydown',e=>{if($('modal').open||['INPUT','SELECT'].includes(document.activeElement.tagName))return;if(tab==='settings'){if(e.key==='Escape')switchTab('home');return;}if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();choose((selected+(e.key==='ArrowRight'?1:-1)+games.length)%games.length)}if(e.key==='Escape')switchTab('home');if(e.key==='Enter'&&document.activeElement===document.body)play()});let gpLatch=false;function pollPad(){let gp=navigator.getGamepads?.()[0];if(gp&&!$('modal').open&&tab!=='settings'){let right=gp.buttons[15]?.pressed||gp.axes[0]>.6,left=gp.buttons[14]?.pressed||gp.axes[0]<-.6,ok=gp.buttons[0]?.pressed,back=gp.buttons[1]?.pressed;let active=right||left||ok||back;if(active&&!gpLatch){if(right||left)choose((selected+(right?1:-1)+games.length)%games.length);else if(ok)play();else if(back)switchTab('home')}gpLatch=active}else gpLatch=false;requestAnimationFrame(pollPad)}

var shownBackdrop=null,backdropSerial=0;
function updateHomeCards(){const track=$('cards');const list=games.filter(x=>filter!=='recent'||x.sub.includes('Última'));const key=list.map(g=>g.id).join('|');if(track.dataset.list!==key){track.innerHTML=list.map(card).join('');track.dataset.list=key}else{track.querySelectorAll('.card').forEach(el=>{const isCurrent=el.dataset.game===games[selected].id;el.classList.toggle('current',isCurrent);el.setAttribute('aria-pressed',String(isCurrent));const heart=el.querySelector('.cover-favorite');if(heart)heart.textContent=favorites.includes(el.dataset.game)?'♥':''})}}
function updateBackdrop(g){if(shownBackdrop===g.id)return;shownBackdrop=g.id;const serial=++backdropSerial;stopBackgroundVideo();const scene=$('scene');scene.classList.remove('scene-enter');const image=document.createElement('img');image.src='assets/'+(g.id==='rogue'?'hero':g.id)+'.webp';image.alt='Fondo de ejemplo de '+g.name;image.className='wallpaper-layer';image.draggable=false;image.style.opacity='0';let revealed=false;const reveal=()=>{if(revealed||serial!==backdropSerial)return;revealed=true;const old=[...scene.querySelectorAll('img')];scene.appendChild(image);if(reduce){image.style.opacity='1';old.forEach(x=>x.remove())}else{requestAnimationFrame(()=>requestAnimationFrame(()=>image.style.opacity='1'));setTimeout(()=>{old.forEach(x=>x.remove())},850)}if(tab==='home')scheduleBackgroundVideo()};image.onload=reveal;image.onerror=()=>{if(serial===backdropSerial)toast('No se pudo cargar este fondo.')};if(image.complete&&image.naturalWidth)reveal()}

var backgroundVideos={},backgroundTimer=null,videoEnabled=true,videoDelay='3';
try{const vp=JSON.parse(localStorage.getItem('exkinet-video-prefs')||'{}');videoEnabled=vp.enabled!==false;videoDelay=['2','3','5'].includes(vp.delay)?vp.delay:'3'}catch{}
function saveVideoPrefs(){try{localStorage.setItem('exkinet-video-prefs',JSON.stringify({enabled:videoEnabled,delay:videoDelay}))}catch{}}
function stopBackgroundVideo(){clearTimeout(backgroundTimer);const v=document.querySelector('#scene video');if(v){v.pause();v.removeAttribute('src');v.load();v.remove()}}
function scheduleBackgroundVideo(){stopBackgroundVideo();const id=games[selected].id;if(!videoEnabled||reduce||!backgroundVideos[id]||tab!=='home')return;backgroundTimer=setTimeout(()=>{if(games[selected].id!==id||tab!=='home')return;const v=document.createElement('video');v.muted=true;v.loop=true;v.playsInline=true;v.preload='auto';v.src=backgroundVideos[id].url;v.addEventListener('playing',()=>v.classList.add('video-ready'),{once:true});v.addEventListener('error',()=>{v.remove();toast('Este navegador no puede reproducir el vídeo. Se conserva la imagen.')},{once:true});$('scene').appendChild(v);v.play().catch(()=>{v.remove();toast('El navegador ha bloqueado la reproducción automática.')})},Number(videoDelay)*1000)}
function preferences(){switchTab('settings');settingsPage('general')}
function settingsPage(page){document.querySelectorAll('[data-settings]').forEach(b=>b.classList.toggle('active',b.dataset.settings===page));const panel=$('settingsContent');const g=games[selected];if(page==='general'){panel.innerHTML=`<h2>Todo en su sitio</h2><p class="notice">Personaliza ExKinet sin salir de tu colección.</p><div class="row"><span>Dispositivo objetivo<small>Lenovo Yoga Tab 13 · Snapdragon 870 · 8 GB RAM</small></span></div><div class="row"><span>Juego seleccionado<small>${g.name}</small></span><button class="secondary" onclick="switchTab('library')">Cambiar</button></div><div class="row"><span>Versión<small>Prototipo interactivo · No ejecuta juegos.</small></span></div><button class="secondary modal-action" onclick="importGame()">＋ Añadir juegos</button>`}
if(page==='appearance'){panel.innerHTML=`<h2>Apariencia y movimiento</h2><p class="notice">Degradado cinematográfico, selección luminosa y transiciones suaves.</p><label class="row"><span>Reducir animaciones<small>Desactiva el movimiento y los vídeos automáticos.</small></span><input class="switch" id="settingsMotion" type="checkbox" ${reduce?'checked':''}></label><div class="row"><span>Estilo<small>Azul eléctrico · Tema oscuro</small></span></div>`;$('settingsMotion').onchange=e=>{reduce=e.target.checked;document.body.classList.toggle('reduced',reduce);save()}}
if(page==='graphics'||page==='textures'||page==='backup'){if(page==='graphics')quality();if(page==='textures')textures();if(page==='backup')backup();panel.innerHTML='<h2>'+$('modalTitle').textContent+'</h2>'+$('modalBody').innerHTML;$('modalBody').innerHTML='';$('modal').close();if(page==='graphics'){$('qualitySelect').value=profiles[g.id]?.profile||'Equilibrado';$('resolution').value=profiles[g.id]?.resolution||'2';$('renderer').value=profiles[g.id]?.renderer||'Vulkan';$('qualitySelect').onchange=()=>{$('resolution').value=({'Rendimiento':'1','Equilibrado':'2','Calidad':'3'})[$('qualitySelect').value]}}if(page==='textures')$('textureToggle').onchange=e=>{profiles[g.id]={...(profiles[g.id]||{}),textures:e.target.checked};save();toast('Preferencia de demostración guardada')}}
if(page==='controls'){panel.innerHTML='<h2>Controles</h2><p class="notice">La demo admite navegación táctil, teclado y mandos compatibles con el navegador.</p><div class="row"><span>Elegir juego<small>Toca una carátula, desliza sobre la colección o usa ← / →.</small></span></div><div class="row"><span>Mando<small>Cruceta o stick izquierdo para navegar. Botón principal para abrir el juego de ejemplo.</small></span></div><div class="row"><span>Volver<small>Escape para regresar a Inicio.</small></span></div>'}
if(page==='media'){panel.innerHTML=`<h2>Primero imagen. Después vídeo.</h2><p class="notice">Al elegir un juego se muestra su imagen. Tras unos segundos, el vídeo aparece con una transición suave, sin sonido.</p><label class="row"><span>Vídeos automáticos</span><input class="switch" type="checkbox" id="autoVideo" ${videoEnabled?'checked':''}></label><label class="row"><span>Espera antes del vídeo</span><select id="videoDelay"><option value="2">2 segundos</option><option value="3">3 segundos</option><option value="5">5 segundos</option></select></label><p class="video-help">Añade un MP4 o WebM de ejemplo. Los vídeos elegidos se conservan solo mientras esta página siga abierta; no se suben a ningún servidor. Si un juego no tiene vídeo, mantiene su imagen.</p><div id="videoGameList"></div>`;$('videoDelay').value=videoDelay;$('autoVideo').onchange=e=>{videoEnabled=e.target.checked;saveVideoPrefs()};$('videoDelay').onchange=e=>{videoDelay=e.target.value;saveVideoPrefs()};games.forEach((game,i)=>{const row=document.createElement('div');row.className='row';const label=document.createElement('span');label.textContent=game.name;const small=document.createElement('small');small.textContent=backgroundVideos[game.id]?.name||'Sin vídeo · se mostrará la imagen';label.appendChild(small);const controls=document.createElement('div');const upload=document.createElement('label');upload.className='upload-button';upload.textContent=backgroundVideos[game.id]?'Cambiar vídeo':'＋ Añadir vídeo';const input=document.createElement('input');input.type='file';input.accept='video/mp4,video/webm';input.hidden=true;input.onchange=()=>attachVideo(i,input);upload.appendChild(input);controls.appendChild(upload);if(backgroundVideos[game.id]){const remove=document.createElement('button');remove.className='remove-video';remove.textContent='Eliminar';remove.onclick=()=>{URL.revokeObjectURL(backgroundVideos[game.id].url);delete backgroundVideos[game.id];settingsPage('media')};controls.appendChild(remove)}row.append(label,controls);$('videoGameList').appendChild(row)})}}
function attachVideo(i,input){const file=input.files?.[0];if(!file)return;if(!['video/mp4','video/webm'].includes(file.type)&&!/\.(mp4|webm)$/i.test(file.name)){toast('Elige un vídeo MP4 o WebM.');return}if(file.size>150*1024*1024){toast('Prueba un vídeo de menos de 150 MB.');return}const id=games[i].id;if(backgroundVideos[id])URL.revokeObjectURL(backgroundVideos[id].url);backgroundVideos[id]={url:URL.createObjectURL(file),name:file.name};settingsPage('media');toast('Vídeo listo. Selecciona '+games[i].name+' en Inicio.')}
let swipeStart=null,suppressCardClick=false;$('cards').addEventListener('click',e=>{if(suppressCardClick){e.preventDefault();e.stopImmediatePropagation();suppressCardClick=false}},true);$('cards').addEventListener('pointerdown',e=>{swipeStart={x:e.clientX,y:e.clientY}});$('cards').addEventListener('pointerup',e=>{if(!swipeStart)return;let dx=e.clientX-swipeStart.x,dy=e.clientY-swipeStart.y;swipeStart=null;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4){suppressCardClick=true;setTimeout(()=>suppressCardClick=false,350);choose((selected+(dx<0?1:-1)+games.length)%games.length)}});$('cards').addEventListener('pointercancel',()=>swipeStart=null);document.addEventListener('visibilitychange',()=>{if(document.hidden)stopBackgroundVideo();else if(tab==='home')scheduleBackgroundVideo()});

render();$('clock').textContent=new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});pollPad();
</script></body></html>
